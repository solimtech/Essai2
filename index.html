```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma mise en page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 5px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: auto;
            border: 1px solid blue;
            border-radius: 18px;
            padding: 24px 30px;
            text-align: center;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 35px;
        }

        .column {
            width: 45%;
        }

        h3 {
            color: blue;
            font-size: 18px;
            font-weight: normal;
            margin: 0 0 35px;
        }

        p {
            font-size: 16px;
            margin: 0 0 35px;
        }

        .image-placeholder {
            font-size: 16px;
            margin-bottom: 0;
        }

        .center-section {
            margin: 60px 0 45px;
        }

        .center-section h3 {
            color: black;
            margin-bottom: 45px;
        }

        .center-section p {
            margin-bottom: 45px;
        }

        .bottom-row {
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 12px;
            }

            .row {
                gap: 15px;
            }

            .column {
                width: 50%;
            }

            h3, p, .image-placeholder {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Première ligne : deux colonnes -->
        <div class="row">

            <div class="column">
                <h3>titre 1</h3>
                <p>Text</p>
                <div class="image-placeholder">Image 1</div>
            </div>

            <div class="column">
                <h3>titre 2</h3>
                <p>Text</p>
                <div class="image-placeholder">Image 1</div>
            </div>

        </div>

        <!-- Section centrale -->
        <div class="center-section">
            <h3>Titre 3</h3>
            <p>text</p>
            <div class="image-placeholder">image 3</div>
        </div>

        <!-- Dernière ligne : deux colonnes -->
        <div class="row bottom-row">

            <div class="column">
                <h3>titre 1</h3>
                <p>Text</p>
                <div class="image-placeholder">Image 1</div>
            </div>

            <div class="column">
                <h3>titre 2</h3>
                <p>Text</p>
                <div class="image-placeholder">Image 1</div>
            </div>

        </div>

    </div>

</body>
</html>
